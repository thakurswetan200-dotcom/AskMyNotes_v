server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static frontend files
    # All routing is handled client-side in script.js which calls
    # the backend public URL directly (Render free tier does not support
    # inter-service Docker networking via hostname — "backend:7860" is
    # only valid inside docker-compose, not on Render isolated containers).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
