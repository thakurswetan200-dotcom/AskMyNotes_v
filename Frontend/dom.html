<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM and Events Demo - AskMyNotes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-md border border-gray-200 p-8 max-w-md w-full text-center space-y-4">
    <h1 id="h1_id" class="text-2xl font-bold text-gray-800">Working with the DOM</h1>
    <p class="text-sm text-gray-500">JavaScript DOM and Event Handling Demonstration</p>
    
    <div class="space-y-3 pt-2">
      <input 
        type="text" 
        id="t1" 
        placeholder="Enter some text..." 
        class="w-full border border-gray-300 rounded-lg px-4 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <button 
        id="b1" 
        onclick="click_btn()" 
        class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-2.5 rounded-lg transition"
      >
        Click Me
      </button>
    </div>

    <div class="pt-4 border-t border-gray-100 text-xs text-gray-500 flex justify-center gap-4">
      <a href="index.html" class="text-blue-600 hover:underline">Home</a>
      <span>&bull;</span>
      <a href="notes.html" class="text-blue-600 hover:underline">Notes</a>
      <span>&bull;</span>
      <a href="signup.html" class="text-blue-600 hover:underline">Sign Up</a>
    </div>
  </div>

  <script>
    function click_btn() {
      var val = document.getElementById("t1").value;
      if (!val) {
        alert("Please type something in the input box!");
      } else {
        alert("Button Clicked: " + val);
      }
    }
  </script>
</body>
</html>
