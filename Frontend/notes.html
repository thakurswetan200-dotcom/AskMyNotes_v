<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AskMyNotes - Interactive Q&A</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white max-w-lg w-full rounded-2xl shadow-xl p-8 space-y-6">
    <header class="text-center">
      <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">AskMyNotes</h1>
      <p class="text-sm text-gray-500 mt-1">Chat and ask questions about your documents & notes</p>
    </header>

    <div class="space-y-4">
      <div>
        <label for="question" class="block text-sm font-semibold text-gray-700 mb-1">Your Question</label>
        <input 
          type="text" 
          id="question"
          class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
          placeholder="Type your question here..." 
        />
      </div>

      <div>
        <label for="notes" class="block text-sm font-semibold text-gray-700 mb-1">Upload Notes (PDF or TXT)</label>
        <input 
          type="file" 
          id="notes" 
          accept=".txt,.pdf"
          class="w-full text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition cursor-pointer" 
        />
      </div>

      <button 
        id="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-3 rounded-lg shadow-md hover:shadow-lg transition flex items-center justify-center gap-2"
      >
        <span id="btn-label">Ask Notes</span>
      </button>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Response</label>
        <div 
          id="output"
          class="border border-gray-200 rounded-xl p-5 text-gray-700 bg-gray-50 min-h-[120px] flex items-center justify-center transition"
        >
          <div class="text-sm text-gray-400 text-center">Your answer will appear here...</div>
        </div>
      </div>
    </div>

    <div class="pt-2 border-t border-gray-100 flex justify-between text-xs text-gray-500">
      <a href="signup.html" class="text-blue-600 hover:underline">← Back to Sign Up</a>
      <a href="dom.html" class="text-blue-600 hover:underline">DOM Demo →</a>
    </div>
  </div>

  <script>
    const questionInput = document.getElementById('question');
    const fileInput = document.getElementById('notes');
    const submitButton = document.getElementById('submit');
    const btnLabel = document.getElementById('btn-label');
    const output = document.getElementById('output');

    submitButton.addEventListener('click', async () => {
      const question = questionInput.value.trim();
      const file = fileInput.files[0];

      if (!question) {
        output.innerHTML = '<div class="text-sm font-medium text-red-500">Please enter a question first.</div>';
        return;
      }

      submitButton.disabled = true;
      btnLabel.textContent = 'Processing...';

      output.innerHTML = `
        <div class="flex items-center gap-3 text-blue-600 py-4">
          <div class="spinner"></div>
          <span class="font-medium text-sm">Generating AI answer from notes...</span>
        </div>
      `;

      const formData = new FormData();
      formData.append('question', question);
      if (file) {
        formData.append('notes', file);
      }

      const backendUrl = window.location.origin.includes('8000')
        ? `${window.location.origin}/api/ask`
        : 'http://localhost:8000/api/ask';

      try {
        const response = await fetch(backendUrl, {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          const result = await response.json();
          output.innerHTML = `
            <div class="space-y-2 text-sm text-gray-800 text-left w-full fade-in">
              <div class="flex items-center justify-between pb-2 border-b border-gray-200">
                <span class="font-bold text-gray-900">Answer Received</span>
                <span class="text-xs px-2 py-0.5 rounded bg-green-100 text-green-700 font-medium">Success</span>
              </div>
              <p><strong class="text-gray-700">Question:</strong> ${question}</p>
              ${file ? `<p class="text-xs text-gray-500"><strong>Document:</strong> ${file.name}</p>` : ''}
              <div class="mt-3 p-3 bg-white rounded-lg border border-gray-100 text-gray-800 leading-relaxed shadow-sm">
                ${result.answer}
              </div>
            </div>
          `;
        } else {
          output.innerHTML = '<div class="text-sm font-medium text-red-500">Failed to get an answer from the backend server.</div>';
        }
      } catch (error) {
        console.error('Error:', error);
        output.innerHTML = '<div class="text-sm font-medium text-red-500">An error occurred while contacting the server. Ensure backend is running on port 8000.</div>';
      } finally {
        submitButton.disabled = false;
        btnLabel.textContent = 'Ask Notes';
      }
    });
  </script>
</body>
</html>
